version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Keep lockstep packages together so major bumps don't arrive as
      # individually broken PRs.
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      eslint:
        patterns:
          - eslint
          - '@eslint/*'
          - typescript-eslint
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint's peer range gates the TypeScript major (>=4.8.4
      # <6.1.0 as of 8.67.0), so 7.x cannot be installed alongside eslint.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  # The documentation site has its own manifest so its toolchain never lands in
  # the runtime image or the test matrix.
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    groups:
      docs:
        patterns:
          - '*'

  # Exists so the digest-pinned base image gets refreshed at all. Node majors
  # are excluded because Dependabot offers whatever tag is newest, while the
  # runtime image has to sit on an ACTIVE LTS line — and roughly half of all
  # Node majors never become LTS. Crossing an LTS boundary is a decision.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init and analyze are separate dependencies to Dependabot but must
      # always move together — a version mismatch kills the codeql job.
      codeql:
        patterns:
          - github/codeql-action*
