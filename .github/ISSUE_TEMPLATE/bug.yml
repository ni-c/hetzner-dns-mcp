name: Bug report
description: Something behaves wrongly or breaks
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: 'hetzner-dns-mcp version'
      placeholder: '0.2.3 (npm version, docker tag or commit)'
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Which API token are you using?
      description: >-
        Tokens from the old DNS Console (dns.hetzner.com) do not work — that API
        was shut down in May 2026.
      options:
        - Hetzner Cloud API token (Cloud Console > Security > API tokens)
        - Old DNS Console token (dns.hetzner.com)
        - Not sure
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: 'Claude Code, Claude Desktop, Codex, MCP Inspector, …'
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you called, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: >-
        Tool result or stderr. Please redact tokens, private keys, internal hostnames
        and IPs — this issue is public.
      render: text
